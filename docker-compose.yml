services:
  mindhx-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mindhx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mindhx}
      POSTGRES_DB: ${POSTGRES_DB:-mindhx}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mindhx}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mindhx-api:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      WHISPER_MODEL: ${WHISPER_MODEL:-small}
      WHISPER_DEVICE: ${WHISPER_DEVICE:-cpu}
      WEB_ORIGIN: http://localhost:3000
      VOICE_BIOMARKER_PROVIDER: ${VOICE_BIOMARKER_PROVIDER:-local}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      DASHSCOPE_MODEL: ${DASHSCOPE_MODEL:-qwen-plus}
      DASHSCOPE_BASE_URL: ${DASHSCOPE_BASE_URL:-https://dashscope-intl.aliyuncs.com/compatible-mode/v1}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openai/gpt-4o-mini}
      OPENROUTER_SITE_URL: ${OPENROUTER_SITE_URL:-http://localhost:3000}
      UPLIFT_API_KEY: ${UPLIFT_API_KEY:-}
      UPLIFT_VOICE_ID: ${UPLIFT_VOICE_ID:-v_8eelc901}
      UPLIFT_OUTPUT_FORMAT: ${UPLIFT_OUTPUT_FORMAT:-MP3_22050_128}
      DATABASE_URL: postgresql://${POSTGRES_USER:-mindhx}:${POSTGRES_PASSWORD:-mindhx}@mindhx-db:5432/${POSTGRES_DB:-mindhx}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-60}
      PASSWORD_RESET_EXPIRE_MINUTES: ${PASSWORD_RESET_EXPIRE_MINUTES:-30}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-no-reply@mindhx.local}
    volumes:
      - whisper-cache:/root/.cache
    depends_on:
      mindhx-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  mindhx-web:
    build:
      context: .
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      mindhx-api:
        condition: service_healthy

volumes:
  whisper-cache:
  postgres-data: